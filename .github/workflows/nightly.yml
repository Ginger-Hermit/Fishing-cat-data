# Patch note: nightly break test: 100,000 scrambled AI replies with a new random seed each night (normal pushes run 5,000).
name: Nightly
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz (the seed is printed so a failure can be repeated)
        run: SEED=$(date +%Y%m%d); echo "seed $SEED"; node tests/fuzz.js $SEED 100000 | tail -30
