# Patch note: also checks readability (axe) and warns if index.html grows over 5% in one push.
name: Check
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tests/check.py
      - run: node tests/rows.test.js
      - run: node tests/bills.test.js
      - run: node tests/fuzz.js 7 5000
      - name: Size watch (index.html must not grow over 5% in one push)
        run: |
          git fetch -q --depth=2 origin "$GITHUB_SHA" || exit 0
          OLD=$(git show HEAD~1:index.html 2>/dev/null | wc -c); NEW=$(wc -c < index.html)
          echo "index.html: $OLD -> $NEW bytes"
          [ "$OLD" -eq 0 ] || [ $((NEW * 100)) -le $((OLD * 105)) ] || { echo "FAIL index.html grew over 5%"; exit 1; }
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        b: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save playwright axe-core@4.10.2
      - run: npx playwright install --with-deps ${{ matrix.b == 'webkit' && 'webkit chromium' || matrix.b }} 2>&1 | tail -40
      - run: BROWSERS=${{ matrix.b }} node tests/browser.test.js
      - if: matrix.b == 'chromium'
        run: node tests/a11y.test.js
      - if: matrix.b == 'chromium'
        run: node tests/keys.test.js
      - if: matrix.b == 'chromium'
        run: node tests/privacy.test.js
      - name: Phone pictures (every tab, newest iPhone and Pixel, light, dark, big text)
        if: always() && matrix.b == 'webkit'
        run: node tests/pictures.js
      - uses: actions/upload-artifact@v4
        if: always() && matrix.b == 'webkit'
        with:
          name: phone-pictures
          path: pictures/
          retention-days: 7
  excel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libreoffice-calc > /dev/null
      - run: npm install --no-save exceljs@4.4.0
      - run: node tests/excel-math.test.js
  attack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright
      - run: python3 -m playwright install --with-deps chromium 2>&1 | tail -20
      - run: python3 tools/attack.py
