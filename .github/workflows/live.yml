# Patch note: weekly live-site check; never fails (so no emails), writes the result to developer/LIVE_CHECK_LOG.md.
name: Live site
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check fishing-cat-data.pages.dev
        run: |
          SITE=https://fishing-cat-data.pages.dev
          WANT=$(tr -d '[:space:]' < version.txt)
          R=""
          if curl -fsS -m 30 -D head.txt -o page.html "$SITE/?t=$(date +%s)"; then
            GOT=$(curl -fsS -m 30 "$SITE/version.txt?t=$(date +%s)" | tr -d '[:space:]')
            [ "$GOT" = "$WANT" ] || R="$R live version.txt is $GOT, repo has $WANT;"
            curl -fsS -m 30 -o app.js.live "$SITE/app.js?t=$(date +%s)" && grep -q "const BUILD = \"$WANT\"" app.js.live || R="$R live code is not version $WANT;"
            grep -qi "^content-security-policy:.*connect-src" head.txt || R="$R security header missing;"
            grep -qi "^x-content-type-options: nosniff" head.txt || R="$R nosniff header missing;"
          else
            R=" page does not load;"
          fi
          F=developer/LIVE_CHECK_LOG.md
          [ -f $F ] || printf '# Live site checks\nWritten by GitHub every Monday. Newest at the bottom.\n\n' > $F
          echo "- $(date -u +%Y-%m-%d) version $WANT: ${R:- OK}" >> $F
          git add $F
          git -c user.name="github-actions" -c user.email="noreply@github.com" commit -qm "Live site check [skip ci]"
          git push -q || echo "could not save the log"
